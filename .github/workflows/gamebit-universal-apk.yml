name: Gamebit Universal APK CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force clean rebuild with no Gradle build cache'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD FRESH UNIVERSAL DEBUG APK
  # ============================================================
  build-universal-apk:
    name: Build Fresh Universal Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # Keep the existing debugConfig signing configuration working cleanly.
      - name: Create debug keystore
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -f "$GITHUB_WORKSPACE/debug.keystore"
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Verify debug keystore
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

      - name: Create .env if missing
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Fresh Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="2.0.0-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"

          rm -rf app/build/outputs/apk artifacts

          GRADLE_FLAGS="--no-daemon --no-build-cache --rerun-tasks --stacktrace"
          gradle :app:clean :app:assembleDebug \
            $GRADLE_FLAGS \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find app/build/outputs -type f -maxdepth 6 || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Package APK & Publish Build Summary
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="Gamebit-v2.0.0-run${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}.apk"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"

          SHA256="$(sha256sum "artifacts/${APK_NAME}" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "artifacts/${APK_NAME}")"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          BUILD_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## Gamebit Fresh Debug APK"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **APK File** | \`${APK_NAME}\` |"
            echo "| **Version** | \`2.0.0-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}\` (code \`${GITHUB_RUN_NUMBER}\`) |"
            echo "| **Commit** | \`${SHORT_SHA}\` — ${COMMIT_MSG} |"
            echo "| **Built At** | ${BUILD_UTC} |"
            echo "| **Size** | ${SIZE_BYTES} bytes |"
            echo "| **SHA-256** | \`${SHA256}\` |"
            echo ""
            echo "> **Note:** Use **Run workflow** on a branch to build the newest commit. Clicking **Re-run all jobs** rebuilds that specific run's commit cleanly with zero build cache."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fresh APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebit-Debug-APK-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # UNIT + ROBOLECTRIC + ANDROID LINT
  # ============================================================
  test-and-lint:
    name: Unit + Robolectric Tests + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Create .env if missing
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Run Unit and Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gamebit-Reports-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

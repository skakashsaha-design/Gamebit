name: Build ChessHub Universal APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-universal-apk:
    name: Test, Lint & Build Universal APK
    runs-on: ubuntu-latest

    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Ensure Secrets plugin placeholder .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Ensure debug keystore exists for debugConfig signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build Universal Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Universal Release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew :app:assembleRelease
          rm -f "$KEYSTORE_PATH"

      - name: Rename and verify Universal APK output
        run: |
          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/ChessHub-universal-debug.apk

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              dist/ChessHub-universal-release.apk
          fi

          echo "APK files:"
          ls -lh dist/

      - name: Upload Universal APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: dist/*.apk
          retention-days: 30

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: warn
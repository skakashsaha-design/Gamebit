name: Diagnose ChessHub Kotlin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile Kotlin and capture errors
        shell: bash
        run: |
          set +e

          gradle :app:compileDebugKotlin \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee kotlin-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "KOTLIN COMPILER ERRORS"
          echo "========================================"

          grep -E "^e:|^error:|Compilation error" kotlin-build.log || true

          echo ""
          echo "========================================"
          echo "SOURCE FILE ERRORS"
          echo "========================================"

          grep -E "file:///.*\.kt:[0-9]+:[0-9]+" kotlin-build.log || true

          echo ""
          echo "Gradle exit code: $EXIT_CODE"

          exit $EXIT_CODE

      - name: Upload Kotlin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-build-log
          path: kotlin-build.log
          if-no-files-found: warn
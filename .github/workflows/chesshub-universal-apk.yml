name: ChessHub Universal APK CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-apk:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDK_MANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDK_MANAGER"

          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set executable permission
        shell: bash
        run: |
          chmod +x gradlew

      - name: Check Gradle
        shell: bash
        run: |
          ./gradlew --version

      - name: Prepare project
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "Checking project..."

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          echo "Creating Firebase configuration..."

          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

          if [ ! -s app/google-services.json ]; then
            echo "ERROR: app/google-services.json was not created."
            exit 1
          fi

          echo "Firebase configuration created successfully."

          echo "Creating debug keystore..."

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore

              if [ -f debug.keystore ] && ! keytool -list \
                -keystore debug.keystore \
                -storepass android >/dev/null 2>&1; then
                rm -f debug.keystore
              fi
            fi

            if [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true

            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/ChessHub-debug.apk

          sha256sum dist/ChessHub-debug.apk > dist/SHA256SUMS.txt

          echo "APK:"
          ls -lh dist/ChessHub-debug.apk

          echo "SHA-256:"
          cat dist/SHA256SUMS.txt

          {
            echo "## ChessHub APK"
            echo ""
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---:|---|"

            APK="dist/ChessHub-debug.apk"
            SIZE="$(du -h "$APK" | cut -f1)"
            HASH="$(sha256sum "$APK" | awk '{print $1}')"

            echo "| \`ChessHub-debug.apk\` | $SIZE | \`$HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-APK
          path: |
            dist/ChessHub-debug.apk
            dist/SHA256SUMS.txt
          retention-days: 30


  test-and-lint:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5

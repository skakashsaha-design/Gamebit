name: ChessHub Universal APK CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-apk:
    name: Test, Lint & Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and ensure API 36 SDK
        shell: bash
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets plugin .env, debug keystore, and optional Firebase config
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run Unit and Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Build Universal Debug APK (single APK, no ABI splits)
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Universal Release APK (when release signing secrets are set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon

      - name: Package and verify Universal APK artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: app/build/outputs/apk/debug/app-debug.apk not found"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/ChessHub-universal-debug.apk

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/ChessHub-universal-release.apk
          fi

          ls -lh dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

          {
            echo "## ChessHub Universal APK Build Summary"
            echo ""
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---|---|"
            for apk in dist/*.apk; do
              name="$(basename "$apk")"
              size="$(du -h "$apk" | cut -f1)"
              hash="$(sha256sum "$apk" | awk '{print $1}')"
              echo "| \`$name\` | $size | \`$hash\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Universal APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

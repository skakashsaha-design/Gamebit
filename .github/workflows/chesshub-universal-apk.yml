name: ChessHub Universal APK CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD APK
  # ============================================================
  build-universal-apk:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Keep the existing debug signing configuration working.
      - name: Create debug keystore
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Verify debug keystore
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

      - name: Create .env if missing
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Universal Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find app/build/outputs -type f -maxdepth 6 || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK with clear filename
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            artifacts/ChessHub-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-Debug-APK
          path: artifacts/ChessHub-debug.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # UNIT + ROBOLECTRIC + LINT
  # ============================================================
  test-and-lint:
    name: Unit + Robolectric Tests + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT:
      # Robolectric + Android API 36 should run on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Robolectric tests use the same debug signing configuration
      # as the debug APK build.
      - name: Create debug keystore
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Create .env if missing
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Show Java version
        run: |
          java -version

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Run Unit and Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
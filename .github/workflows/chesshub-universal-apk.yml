name: ChessHub Universal APK CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-apk:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDK_MANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDK_MANAGER"

          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        shell: bash
        run: |
          gradle --version

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore

              if [ -f debug.keystore ] && ! keytool -list \
                -keystore debug.keystore \
                -storepass android >/dev/null 2>&1; then
                rm -f debug.keystore
              fi
            fi

            if [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            echo ""
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/ChessHub-debug.apk

          sha256sum dist/ChessHub-debug.apk > dist/SHA256SUMS.txt

          echo ""
          echo "=== APK ==="
          ls -lh dist/

          echo ""
          echo "=== SHA-256 ==="
          cat dist/SHA256SUMS.txt

          {
            echo "## ChessHub APK"
            echo ""
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---:|---|"

            APK="dist/ChessHub-debug.apk"
            SIZE="$(du -h "$APK" | cut -f1)"
            HASH="$(sha256sum "$APK" | awk '{print $1}')"

            echo "| \`ChessHub-debug.apk\` | $SIZE | \`$HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-APK
          path: |
            dist/ChessHub-debug.apk
            dist/SHA256SUMS.txt
          retention-days: 30


  test-and-lint:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDK_MANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Run Android Lint
        run: |
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14